# ballerina:13 matches the constant HUB_SECRET = "hub.secret" (the WebSub form-parameter name, not a secret) and the
# public API record field `SubscriptionChangeRequest.secret = ""` (empty means 'no secret'; renaming it is an API break).
# ballerina:14 matches variables such as secretKey/configuredSecret that hold optional user-supplied secrets, and the
# `auth` config forwarding. No credential literal is embedded in the library.
# TODO: replace this rule exclusion with a targeted scan suppression (with a reason) once `bal scan` supports it
# (planned for v0.13.0), and fix the false positives on the scan tool side: a secret-named identifier should only be
# reported when it is assigned a fixed value.
[rule]
exclude = ["ballerina:13", "ballerina:14"]
