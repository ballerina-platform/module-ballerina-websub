[package]
org = "ballerina"
name = "websub"
version = "@toml.version@"
authors = ["Ballerina"]
keywords = ["websub", "subscriber", "service", "listener", "Type/Connector", "Type/Trigger", "Area/Built-in", "Area/Network & Protocols", "Name/WebSub"]
repository = "https://github.com/ballerina-platform/module-ballerina-websub"
icon = "icon.png"
license = ["Apache-2.0"]
distribution = "2201.14.0"
include = ["metadata/**"]

[platform.java25]
graalvmCompatible = true

[[platform.java25.dependency]]
groupId = "io.ballerina.stdlib"
artifactId = "websub-native"
version = "@toml.version@"
path = "../native/build/libs/websub-native-@project.version@.jar"
